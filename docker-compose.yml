services:
  db:
    image: postgres:16-alpine
    container_name: hms_postgres
    environment:
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: hms_password
      POSTGRES_DB: hms_dev
    ports:
      - "5432:5432"
    volumes:
      - hms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d hms_dev"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  hms_pgdata:
